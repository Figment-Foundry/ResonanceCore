<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">How a ResonanceCore message moves</title><desc id="d">The builder resolves the reviewer label to its live session ID on the shared SQLite bus, sends a message pinned to that session, and the reviewer reads it with agent-msg drain or through its harness hook.</desc><defs><marker id="head-1c2823" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2823"/></marker><marker id="head-9b4a25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b4a25"/></marker><marker id="head-5b625b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b625b"/></marker></defs><rect width="1200" height="560" fill="#f3f0e7"/><text x="48" y="58" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="1.4">HOW A MESSAGE MOVES</text><text x="48" y="104" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="40" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="-1.2">Resolve, send, read.</text><line x1="48" y1="128" x2="1152" y2="128" stroke="#1c2823" stroke-width="1"/><rect x="56" y="188" width="300" height="230" fill="#dfddd1"/><rect x="48" y="180" width="300" height="230" fill="#fbfaf5" stroke="#a9ad9f" stroke-width="1.5"/><text x="72" y="214" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">BUILDER SESSION</text><text x="72" y="252" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="28" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">builder</text><text x="72" y="286" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Any supported harness,</text><text x="72" y="307" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">or a plain shell.</text><rect x="458" y="168" width="300" height="270" fill="#dfddd1"/><rect x="450" y="160" width="300" height="270" fill="#fbfaf5" stroke="#1c2823" stroke-width="2"/><rect x="450" y="160" width="300" height="46" fill="#1c2823"/><text x="472" y="190" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="20" fill="#faf8ef" font-weight="400" text-anchor="start" letter-spacing="0">Shared SQLite bus</text><text x="472" y="236" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="1.2">DIRECTORY</text><text x="472" y="260" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">label → live session ID</text><text x="472" y="281" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">leased, so stale entries expire</text><line x1="472" y1="312" x2="728" y2="312" stroke="#c9c5b9"/><text x="472" y="340" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="1.2">INBOX</text><text x="472" y="364" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">each message pinned to</text><text x="472" y="385" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">one recipient session</text><rect x="860" y="188" width="300" height="230" fill="#dfddd1"/><rect x="852" y="180" width="300" height="230" fill="#fbfaf5" stroke="#9b4a25" stroke-width="2"/><text x="876" y="214" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="1.2">REVIEWER SESSION</text><text x="876" y="252" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="28" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">reviewer</text><text x="876" y="286" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Reads with agent-msg drain,</text><text x="876" y="307" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">or its harness hook delivers</text><text x="876" y="328" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">the mail on the next prompt,</text><text x="876" y="349" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">or wakes it where supported.</text><line x1="348" y1="250" x2="446" y2="250" stroke="#1c2823" stroke-width="2" marker-end="url(#head-1c2823)"/><text x="397" y="236" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#1c2823" font-weight="400" text-anchor="middle" letter-spacing="0">01  Resolve</text><line x1="446" y1="290" x2="350" y2="290" stroke="#5b625b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#head-5b625b)"/><text x="397" y="312" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="middle" letter-spacing="0">session ID</text><line x1="348" y1="360" x2="446" y2="360" stroke="#1c2823" stroke-width="2" marker-end="url(#head-1c2823)"/><text x="397" y="346" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#1c2823" font-weight="400" text-anchor="middle" letter-spacing="0">02  Send</text><line x1="750" y1="360" x2="848" y2="360" stroke="#9b4a25" stroke-width="2" marker-end="url(#head-9b4a25)"/><text x="799" y="346" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="middle" letter-spacing="0">03  Read</text><line x1="48" y1="498" x2="1152" y2="498" stroke="#c9c5b9"/><text x="48" y="524" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="13" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">Everything stays on one machine under one OS account. No hosted service or model account is needed.</text><text x="1152" y="524" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#5b625b" font-weight="400" text-anchor="end" letter-spacing="0">F/ Figment Foundry · ResonanceCore 0.6.0</text></svg>
