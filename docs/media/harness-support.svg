<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t d"><title id="t">ResonanceCore harness support matrix</title><desc id="d">Codex: joins via Terminal hooks via the session service; idle delivery wakes idle session (Bounded bridge); verified by Real queue and Unix endpoint fixtures; Pi 0.84.3: joins via Global extension; idle delivery wakes idle session (sendMessage, triggerTurn); verified by Real idle RPC process; OpenCode 1.18.25: joins via Global plugin; idle delivery wakes idle session (Same session promptAsync); verified by Real server process; T3 Code 0.1.11: joins via Claude/Codex hooks; T3 thread owns the address; idle delivery wakes idle session (Fixed doorbell turn); verified by Live T3 server; idle threads woken; Claude Code 2.1.282: joins via Lifecycle and prompt hooks; idle delivery opt-in (Channels, per-launch opt-in); verified by Real prompt hooks; live channel consent not exercised; Kimi Code 0.38.0: joins via Lifecycle and prompt hooks; idle delivery waits for next prompt (Next prompt only); verified by Real prompt hooks; no terminal idle API</desc><defs><marker id="head-1c2823" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2823"/></marker><marker id="head-9b4a25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b4a25"/></marker><marker id="head-5b625b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b625b"/></marker></defs><rect width="1200" height="730" fill="#f3f0e7"/><text x="48" y="58" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="1.4">HARNESS SUPPORT · 0.6.0</text><text x="48" y="104" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="40" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="-1.2">Every harness gets mail. Most can wake.</text><line x1="48" y1="128" x2="1152" y2="128" stroke="#1c2823" stroke-width="1"/><text x="48" y="174" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">HARNESS</text><text x="260" y="174" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">JOINS THE BUS</text><text x="600" y="174" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">IDLE DELIVERY</text><text x="860" y="174" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">HOW IT WAS VERIFIED</text><line x1="48" y1="196" x2="1152" y2="196" stroke="#c9c5b9"/><text x="48" y="226" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Codex</text><text x="260" y="233" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Terminal hooks via the session service</text><rect x="600" y="210" width="232" height="36" fill="#9b4a25"/><circle cx="620" cy="228" r="6" fill="#faf8ef"/><text x="636" y="233" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#faf8ef" font-weight="700" text-anchor="start" letter-spacing="0">Bounded bridge</text><text x="860" y="233" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Real queue and Unix endpoint fixtures</text><line x1="48" y1="260" x2="1152" y2="260" stroke="#c9c5b9"/><text x="48" y="290" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Pi</text><text x="48" y="310" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">0.84.3</text><text x="260" y="297" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Global extension</text><rect x="600" y="274" width="232" height="36" fill="#9b4a25"/><circle cx="620" cy="292" r="6" fill="#faf8ef"/><text x="636" y="297" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#faf8ef" font-weight="700" text-anchor="start" letter-spacing="0">sendMessage, triggerTurn</text><text x="860" y="297" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Real idle RPC process</text><line x1="48" y1="324" x2="1152" y2="324" stroke="#c9c5b9"/><text x="48" y="354" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">OpenCode</text><text x="48" y="374" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">1.18.25</text><text x="260" y="361" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Global plugin</text><rect x="600" y="338" width="232" height="36" fill="#9b4a25"/><circle cx="620" cy="356" r="6" fill="#faf8ef"/><text x="636" y="361" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#faf8ef" font-weight="700" text-anchor="start" letter-spacing="0">Same session promptAsync</text><text x="860" y="361" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Real server process</text><line x1="48" y1="388" x2="1152" y2="388" stroke="#c9c5b9"/><text x="48" y="418" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">T3 Code</text><text x="48" y="438" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">0.1.11</text><text x="260" y="425" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Claude/Codex hooks; T3 thread owns the address</text><rect x="600" y="402" width="232" height="36" fill="#9b4a25"/><circle cx="620" cy="420" r="6" fill="#faf8ef"/><text x="636" y="425" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#faf8ef" font-weight="700" text-anchor="start" letter-spacing="0">Fixed doorbell turn</text><text x="860" y="416" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Live T3 server;</text><text x="860" y="435" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">idle threads woken</text><line x1="48" y1="452" x2="1152" y2="452" stroke="#c9c5b9"/><text x="48" y="482" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Claude Code</text><text x="48" y="502" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">2.1.282</text><text x="260" y="489" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Lifecycle and prompt hooks</text><rect x="600" y="466" width="232" height="36" fill="#d9a07c"/><circle cx="620" cy="484" r="6" fill="none" stroke="#1c2823" stroke-width="1.6"/><path d="M620,478 A6,6 0 0 0 620,490 Z" fill="#1c2823"/><text x="636" y="489" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Channels, per-launch opt-in</text><text x="860" y="480" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Real prompt hooks;</text><text x="860" y="499" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">live channel consent not exercised</text><line x1="48" y1="516" x2="1152" y2="516" stroke="#c9c5b9"/><text x="48" y="546" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Kimi Code</text><text x="48" y="566" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">0.38.0</text><text x="260" y="553" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Lifecycle and prompt hooks</text><rect x="600" y="530" width="232" height="36" fill="none" stroke="#a9ad9f" stroke-dasharray="4 3"/><circle cx="620" cy="548" r="6" fill="none" stroke="#5b625b" stroke-width="1.6"/><text x="636" y="553" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">Next prompt only</text><text x="860" y="544" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Real prompt hooks;</text><text x="860" y="563" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">no terminal idle API</text><line x1="48" y1="580" x2="1152" y2="580" stroke="#1c2823"/><rect x="48" y="608" width="18" height="18" fill="#9b4a25"/><circle cx="57" cy="617" r="6" fill="#faf8ef"/><text x="76" y="622" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Wakes idle session</text><rect x="298" y="608" width="18" height="18" fill="#d9a07c"/><circle cx="307" cy="617" r="6" fill="none" stroke="#1c2823" stroke-width="1.6"/><path d="M307,611 A6,6 0 0 0 307,623 Z" fill="#1c2823"/><text x="326" y="622" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Opt-in</text><rect x="548" y="608" width="18" height="18" fill="none" stroke="#a9ad9f" stroke-dasharray="4 3"/><circle cx="557" cy="617" r="6" fill="none" stroke="#5b625b" stroke-width="1.6"/><text x="576" y="622" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">Waits for next prompt</text><text x="48" y="660" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">All six deliver mail through their prompt hook or the CLI. Idle delivery differs by harness.</text><line x1="48" y1="674" x2="1152" y2="674" stroke="#c9c5b9"/><text x="48" y="700" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="13" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">Source: agent-msg/integrations/native-harnesses.md. Versions are the ones tested.</text><text x="1152" y="700" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#5b625b" font-weight="400" text-anchor="end" letter-spacing="0">F/ Figment Foundry · ResonanceCore 0.6.0</text></svg>
