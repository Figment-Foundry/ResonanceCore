<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">ResonanceCore session pinning</title><desc id="d">The builder sends to session A and it is delivered. The reviewer restarts as session B. A send still addressed to A is refused with session_replaced. After resolving the label again, a send to B is delivered.</desc><defs><marker id="head-1c2823" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2823"/></marker><marker id="head-9b4a25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b4a25"/></marker><marker id="head-5b625b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b625b"/></marker></defs><rect width="1200" height="600" fill="#f3f0e7"/><text x="48" y="58" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="1.4">SESSION PINNING</text><text x="48" y="104" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="40" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="-1.2">A restarted reviewer gets a new address.</text><line x1="48" y1="128" x2="1152" y2="128" stroke="#1c2823" stroke-width="1"/><text x="48" y="235" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">BUILDER</text><text x="48" y="425" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="1.2">REVIEWER</text><line x1="160" y1="230" x2="1152" y2="230" stroke="#c9c5b9" stroke-width="1.5"/><line x1="160" y1="420" x2="1152" y2="420" stroke="#c9c5b9" stroke-width="1.5"/><rect x="180" y="402" width="330" height="36" fill="#fbfaf5" stroke="#a9ad9f" stroke-width="1.5"/><text x="196" y="426" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">session A · live</text><rect x="535" y="408" width="80" height="24" fill="#f3f0e7"/><text x="575" y="426" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#5b625b" font-weight="400" text-anchor="middle" letter-spacing="0">restart</text><rect x="640" y="402" width="512" height="36" fill="#fbfaf5" stroke="#9b4a25" stroke-width="2"/><text x="656" y="426" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="0">session B · live</text><circle cx="260" cy="230" r="7" fill="#1c2823"/><text x="260" y="208" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1c2823" font-weight="400" text-anchor="middle" letter-spacing="0">send → A</text><line x1="260" y1="240" x2="260" y2="398" stroke="#1c2823" stroke-width="2" marker-end="url(#head-1c2823)"/><text x="272" y="330.0" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#1c2823" font-weight="400" text-anchor="start" letter-spacing="0">delivered</text><circle cx="760" cy="230" r="7" fill="#f3f0e7" stroke="#1c2823" stroke-width="2"/><text x="760" y="208" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1c2823" font-weight="400" text-anchor="middle" letter-spacing="0">send → A</text><line x1="760" y1="240" x2="760" y2="300" stroke="#5b625b" stroke-width="2" stroke-dasharray="5 4"/><text x="760" y="326" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1c2823" font-weight="400" text-anchor="middle" letter-spacing="0">✕ refused: session_replaced</text><circle cx="1020" cy="230" r="7" fill="#9b4a25"/><text x="1020" y="208" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#9b4a25" font-weight="400" text-anchor="middle" letter-spacing="0">resolve, then send → B</text><line x1="1020" y1="240" x2="1020" y2="398" stroke="#9b4a25" stroke-width="2" marker-end="url(#head-9b4a25)"/><text x="1032" y="330.0" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#9b4a25" font-weight="400" text-anchor="start" letter-spacing="0">delivered</text><text x="48" y="500" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="16" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">Mail addressed to an old session ID never reaches a new incarnation. The sender resolves</text><text x="48" y="524" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="16" fill="#465149" font-weight="400" text-anchor="start" letter-spacing="0">the label again and addresses the session that is live now.</text><line x1="48" y1="538" x2="1152" y2="538" stroke="#c9c5b9"/><text x="48" y="564" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="13" fill="#5b625b" font-weight="400" text-anchor="start" letter-spacing="0">agent-msg send --session refuses a replaced session with session_replaced.</text><text x="1152" y="564" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#5b625b" font-weight="400" text-anchor="end" letter-spacing="0">F/ Figment Foundry · ResonanceCore 0.6.0</text></svg>
